<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Chat</title>
    <style>
        /* Modern Dark Theme (Discord-inspired) */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #36393f; color: #dcddde; height: 100vh; display: flex; overflow: hidden; }
        
        /* Login Screen */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100vh; background-color: #2f3136; }
        .login-box { background-color: #36393f; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 350px; text-align: center; }
        .login-box h2 { color: #fff; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: none; border-radius: 4px; background-color: #202225; color: #fff; font-size: 16px; outline: none; }
        .login-box button { width: 100%; padding: 12px; background-color: #5865F2; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .login-box button:hover { background-color: #4752C4; }

        /* Main Chat Layout */
        #chat-screen { display: none; width: 100%; height: 100%; }
        
        /* Sidebar */
        #sidebar { width: 260px; background-color: #2f3136; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); font-weight: bold; font-size: 18px; color: #fff; }
        .room-info { padding: 20px; flex: 1; }
        .room-label { font-size: 12px; text-transform: uppercase; color: #8e9297; font-weight: bold; margin-bottom: 8px; }
        .current-room { font-size: 16px; color: #fff; background-color: #393c43; padding: 8px 12px; border-radius: 4px; display: inline-block; width: 100%; margin-bottom: 20px;}
        .user-panel { background-color: #292b2f; padding: 15px 20px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 10px; }
        .avatar { width: 32px; height: 32px; background-color: #5865F2; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; }

        /* Chat Area */
        #chat-container { flex: 1; display: flex; flex-direction: column; background-color: #36393f; }
        #chat-header { padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); font-weight: bold; font-size: 18px; color: #fff; display: flex; align-items: center; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Message Styles */
        .message { display: flex; flex-direction: column; }
        .msg-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
        .msg-username { font-weight: bold; color: #fff; font-size: 15px; }
        .msg-text { color: #dcddde; font-size: 15px; line-height: 1.4; }
        .system-msg { color: #8e9297; font-style: italic; font-size: 14px; text-align: center; margin: 10px 0; }
        
        /* Input Area */
        #input-area { padding: 20px; background-color: #36393f; }
        .input-wrapper { display: flex; background-color: #40444b; border-radius: 8px; padding: 10px 15px; }
        #messageText { flex: 1; background: transparent; border: none; color: #dcddde; font-size: 15px; outline: none; }
        #messageText::placeholder { color: #72767d; }
        #sendBtn { background: transparent; border: none; color: #5865F2; font-weight: bold; cursor: pointer; padding-left: 15px; outline: none; font-size: 15px; transition: color 0.2s; }
        #sendBtn:hover { color: #4752C4; }
    </style>
</head>
<body>

    <!-- 1. Login Screen -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Welcome Back</h2>
            <input type="text" id="usernameInput" placeholder="Enter your username" autocomplete="off" />
            <input type="text" id="roomInput" placeholder="Enter room name (e.g., General)" autocomplete="off" />
            <button onclick="joinChat()">Join Server</button>
        </div>
    </div>

    <!-- 2. Main Chat Interface -->
    <div id="chat-screen">
        <!-- Sidebar -->
        <div id="sidebar">
            <div class="sidebar-header">Cloud Chat</div>
            <div class="room-info">
                <div class="room-label">Current Channel</div>
                <div class="current-room"># <span id="display-room"></span></div>
            </div>
            <div class="user-panel">
                <div class="avatar" id="avatar-initial">?</div>
                <div id="display-user">Username</div>
            </div>
        </div>
        
        <!-- Chat Area -->
        <div id="chat-container">
            <div id="chat-header"># <span id="header-room"></span></div>
            <div id="chat-box"></div>
            
            <!-- Input Box -->
            <div id="input-area">
                <div class="input-wrapper">
                    <input type="text" id="messageText" placeholder="Message..." autocomplete="off" onkeypress="handleKeyPress(event)" />
                    <button id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var ws;
        var currentUsername = "";

        // Allow pressing Enter to join
        document.getElementById("roomInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") joinChat();
        });

        function joinChat() {
            var user = document.getElementById("usernameInput").value.trim();
            var room = document.getElementById("roomInput").value.trim();

            if (!user || !room) {
                alert("Please enter both a username and a room name.");
                return;
            }

            currentUsername = user;

            // Update UI with the names
            document.getElementById("display-user").textContent = user;
            document.getElementById("avatar-initial").textContent = user.charAt(0).toUpperCase();
            document.getElementById("display-room").textContent = room.toLowerCase();
            document.getElementById("header-room").textContent = room.toLowerCase();

            // Hide login, show chat
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("chat-screen").style.display = "flex";

            // Establish WebSocket Connection
            var wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            ws = new WebSocket(wsProtocol + window.location.host + "/ws/" + room + "/" + user);

            ws.onmessage = function(event) {
                var chatBox = document.getElementById('chat-box');
                var rawData = event.data;
                var messageElement = document.createElement('div');

                // Check if this is a system message (starts with 🟢 or 🔴 from our backend)
                if (rawData.startsWith("🟢") || rawData.startsWith("🔴")) {
                    messageElement.className = 'system-msg';
                    messageElement.textContent = rawData;
                } else {
                    // This is a normal chat message (Format: "Username: Message text")
                    messageElement.className = 'message';
                    
                    // Split the message at the first colon to separate name and text
                    var splitIndex = rawData.indexOf(":");
                    var senderName = rawData.substring(0, splitIndex);
                    var msgContent = rawData.substring(splitIndex + 1);

                    messageElement.innerHTML = `
                        <div class="msg-header">
                            <span class="msg-username">${senderName}</span>
                        </div>
                        <div class="msg-text">${msgContent}</div>
                    `;
                }

                chatBox.appendChild(messageElement);
                chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to bottom
            };
        }

        // Allow pressing Enter to send a message
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function sendMessage() {
            var input = document.getElementById("messageText");
            if (input.value.trim() !== "" && ws) {
                ws.send(input.value);
                input.value = "";
            }
        }
    </script>
</body>
</html>
